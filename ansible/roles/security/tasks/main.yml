---
# Configurar SSH seguro
- name: Configurar SSH — deshabilitar root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^PermitRootLogin"
    line: "PermitRootLogin {{ ssh_permit_root_login }}"
    state: present
  notify: restart sshd
  tags: ssh

- name: Configurar SSH — deshabilitar autenticación por contraseña
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^PasswordAuthentication"
    line: "PasswordAuthentication {{ ssh_password_authentication }}"
    state: present
  notify: restart sshd
  tags: ssh

- name: Configurar SSH — cambiar puerto
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^Port"
    line: "Port {{ ssh_port }}"
    state: present
  notify: restart sshd
  tags: ssh

# Configurar firewall
- name: Instalar firewalld
  ansible.builtin.package:
    name: firewalld
    state: present
  tags: firewall

- name: Iniciar y habilitar firewalld
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: yes
  tags: firewall

- name: Permitir tráfico SSH
  ansible.posix.firewalld:
    service: ssh
    permanent: yes
    state: enabled
  tags: firewall

- name: Permitir tráfico Kubernetes API
  ansible.posix.firewalld:
    port: 6443/tcp
    permanent: yes
    state: enabled
  tags: firewall

# Deshabilitar servicios innecesarios
- name: Deshabilitar servicio telnet si existe
  ansible.builtin.service:
    name: telnet
    state: stopped
    enabled: no
  ignore_errors: yes
  tags: services

# Actualizaciones de seguridad automáticas
- name: Instalar dnf-automatic para actualizaciones de seguridad
  ansible.builtin.package:
    name: dnf-automatic
    state: present
  tags: updates

- name: Activar actualizaciones automáticas de seguridad
  ansible.builtin.service:
    name: dnf-automatic.timer
    state: started
    enabled: yes
  ignore_errors: yes
  tags: updates
