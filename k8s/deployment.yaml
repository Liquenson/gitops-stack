apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-demo
  labels:
    app: pipeline-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pipeline-demo
  template:
    metadata:
      labels:
        app: pipeline-demo
    spec:
      containers:
      - name: pipeline-demo
        image: 538079272432.dkr.ecr.eu-west-1.amazonaws.com/gitops-stack:7
        ports:
        - containerPort: 5000
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
